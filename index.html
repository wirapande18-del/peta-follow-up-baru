<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Peta Follow Up Service</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;background:#f3f7f8;color:#17313a;display:grid;place-items:center;min-height:100vh;margin:0}
    .loading{background:#fff;border:1px solid #dce8ea;border-radius:16px;padding:24px;max-width:560px;box-shadow:0 8px 28px #14343b18}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <b>Memuat Peta Follow Up...</b><br><small>Versi multi-header + template WhatsApp.</small>
  </div>
<script>
(async()=>{
  const ORIGINAL_URL='https://raw.githubusercontent.com/wirapande18-del/peta-follow-up-baru/2b3987d69df46c2353f4b72fff4f7c586a8c3af9/index.html';
  const NEW_IMPORT=`function normalizeHeaderName(value){
  return clean(value)
    .toUpperCase()
    .replace(/[\\r\\n\\t]+/g," ")
    .replace(/[._\\-\\/\\\\]+/g," ")
    .replace(/\\s+/g," ")
    .trim();
}

const HEADER_ALIASES={
  POLICE_NO:["POLICE_NO","POLICE NO","POLICE NUMBER","PLAT","PLAT NO","PLAT NOMOR","NO POLISI","NOMOR POLISI","NOPOL","NO POL"],
  CUSTOMER:["CUSTOMER","CUSTOMER NAME","NAMA CUSTOMER","NAMA PELANGGAN","PELANGGAN","NAMA"],
  MODEL:["MODEL","MODEL NAME","TIPE MODEL","TYPE MODEL","VEHICLE MODEL","MODEL KENDARAAN"],
  VIN:["VIN","VIN NO","VIN NUMBER","NO VIN","NOMOR VIN","CHASSIS NO","CHASSIS NUMBER","NO CHASSIS","NOMOR CHASSIS"],
  SERVICE_ADVISOR:["SERVICE_ADVISOR","SERVICE ADVISOR","SERVICE ADVISER","SA","SA NAME","NAMA SA","ADVISOR","ADVISER"],
  TELEPHONE_CP:["TELEPHONE_CP","TELEPHONE CP","TELEPHONE","PHONE","PHONE NO","PHONE NUMBER","NO HP","NOMOR HP","HP","NO TELP","NOMOR TELP","TELP","TELEPON","WHATSAPP","WA","NO WA","NOMOR WA"],
  RANGKA:["RANGKA","RANGKA DES","RANGKA DESCRIPTION","NO RANGKA","NOMOR RANGKA","CHASSIS","CHASSIS DES","CHASSIS DESCRIPTION"],
  ADDRESS:["ADDRESS","ALAMAT","CUSTOMER ADDRESS","ALAMAT CUSTOMER","ADDRESS CUSTOMER"]
};

function buildHeaderLookup(headerRow){
  const map={};
  headerRow.forEach((value,index)=>{
    const normalized=normalizeHeaderName(value);
    if(normalized && !Object.prototype.hasOwnProperty.call(map,normalized)) map[normalized]=index;
  });
  return map;
}

function findHeaderIndex(headerLookup,aliases){
  for(const alias of aliases){
    const key=normalizeHeaderName(alias);
    if(Object.prototype.hasOwnProperty.call(headerLookup,key)) return headerLookup[key];
  }
  return -1;
}

function detectHeaderRow(matrix){
  let best={rowIndex:-1,score:-1,lookup:null};
  const maxRows=Math.min(matrix.length,25);
  for(let i=0;i<maxRows;i++){
    const lookup=buildHeaderLookup(matrix[i]||[]);
    let score=0;
    for(const aliases of Object.values(HEADER_ALIASES)){
      if(findHeaderIndex(lookup,aliases)>=0) score++;
    }
    if(score>best.score) best={rowIndex:i,score,lookup};
  }
  return best;
}

async function importExcel(file){
  if(!file)return;
  const period=$("uploadPeriod").value;
  if(!period)return toast("Pilih periode.");

  $("uploadResult").textContent="Membaca file Excel...";

  try{
    const b=await file.arrayBuffer();
    const wb=XLSX.read(b,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});

    const detected=detectHeaderRow(matrix);
    if(detected.rowIndex<0 || detected.score<4){
      $("uploadResult").textContent="Header tidak dikenali. Pastikan file memiliki kolom utama seperti POLICE_NO, CUSTOMER, MODEL, SERVICE_ADVISOR, TELEPHONE_CP, VIN/RANGKA, ADDRESS.";
      return toast("Header Excel tidak dikenali");
    }

    const lookup=detected.lookup;
    const idx={
      police_no:findHeaderIndex(lookup,HEADER_ALIASES.POLICE_NO),
      customer_name:findHeaderIndex(lookup,HEADER_ALIASES.CUSTOMER),
      model:findHeaderIndex(lookup,HEADER_ALIASES.MODEL),
      vin:findHeaderIndex(lookup,HEADER_ALIASES.VIN),
      service_advisor:findHeaderIndex(lookup,HEADER_ALIASES.SERVICE_ADVISOR),
      telephone:findHeaderIndex(lookup,HEADER_ALIASES.TELEPHONE_CP),
      rangka:findHeaderIndex(lookup,HEADER_ALIASES.RANGKA),
      address:findHeaderIndex(lookup,HEADER_ALIASES.ADDRESS)
    };

    const valueAt=(row,index)=>index>=0?row[index]:"";
    const parsed=matrix.slice(detected.rowIndex+1).map(row=>{
      const vinValue=clean(valueAt(row,idx.vin));
      const rangkaValue=clean(valueAt(row,idx.rangka));
      return {
        record_key:"",
        period,
        police_no:clean(valueAt(row,idx.police_no)),
        customer_name:clean(valueAt(row,idx.customer_name)),
        model:clean(valueAt(row,idx.model)),
        vin:vinValue||rangkaValue,
        km:0,
        service_advisor:normalizeSA(valueAt(row,idx.service_advisor)),
        telephone:normalizePhone(valueAt(row,idx.telephone)),
        address:clean(valueAt(row,idx.address)),
        latitude:null,
        longitude:null,
        follow_up_status:"Belum Follow Up",
        booking_date:null,
        booking_time:null,
        notes:""
      };
    }).filter(r=>(r.police_no||r.customer_name||r.vin)&&["AYU","FIK","WBN","AJS"].includes(r.service_advisor));

    if(!parsed.length){
      $("uploadResult").textContent="Tidak ada baris yang bisa disimpan. Cek isi data dan SERVICE_ADVISOR (AYU/FIK/WBN/AJS).";
      return toast("Tidak ada data valid");
    }

    parsed.forEach(r=>r.record_key=recordKey(r));

    // Hapus data ganda di dalam file Excel sebelum dikirim ke Supabase.
    // Jika record_key sama muncul lebih dari sekali, data terakhir yang dipakai.
    const uniqueMap=new Map();
    parsed.forEach(r=>uniqueMap.set(r.record_key,r));
    const uniqueParsed=[...uniqueMap.values()];
    const duplicateCount=parsed.length-uniqueParsed.length;

    const {data:{user}}=await sb.auth.getUser();
    const {error:batchError}=await sb.from("upload_batches")
      .insert({period,file_name:file.name,total_rows:uniqueParsed.length,uploaded_by:user.id})
      .select().single();

    if(batchError)return toast("Gagal mencatat upload: "+batchError.message);

    const {error}=await sb.from("customers").upsert(uniqueParsed,{onConflict:"record_key"});
    if(error)return toast("Upload gagal: "+error.message);

    $("uploadResult").textContent=\`\${parsed.length} baris berhasil disimpan online. Header terdeteksi pada baris \${detected.rowIndex+1}.\`;
    await loadData();
    toast("Upload berhasil");
  }catch(error){
    console.error(error);
    $("uploadResult").textContent="Gagal membaca file: "+error.message;
    toast("Upload gagal");
  }
}`;
  try{
    let html=await fetch(ORIGINAL_URL,{cache:"no-store"}).then(r=>{
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r.text();
    });

    html=html.replace(
      '<p>Header: POLICE_NO, CUSTOMER, MODEL, VIN, KM, SERVICE_ADVISOR, TELEPHONE_CP, RANGKA des, ADDRESS.</p>',
      '<p>Header fleksibel. Sistem hanya mengambil: <b>POLICE_NO, CUSTOMER, MODEL, VIN, SERVICE_ADVISOR, TELEPHONE_CP, RANGKA, ADDRESS</b>. Kolom lain diabaikan.</p>'
    );

    const pattern=/    async function importExcel\(file\)\{.*?\}\n\n    const sleep=/s;
    if(!pattern.test(html))throw new Error("Bagian importExcel lama tidak ditemukan.");
    html=html.replace(pattern, NEW_IMPORT+"\n\n    const sleep=");

    // V3 - Template WhatsApp multi pilihan
    html=html.replace(
      '.toast{position:fixed;right:18px;bottom:18px;background:#17313a;color:white;padding:12px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:9999}.toast.show{opacity:1}',
      '.toast{position:fixed;right:18px;bottom:18px;background:#17313a;color:white;padding:12px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:9999}.toast.show{opacity:1}.template-list{display:grid;gap:10px}.template-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfdfd}.template-card h3{margin:0 0 8px;font-size:15px}.template-card textarea{min-height:90px}.modal-backdrop{position:fixed;inset:0;background:#10292f88;display:none;align-items:center;justify-content:center;padding:16px;z-index:9998}.modal-backdrop.show{display:flex}.modal-card{width:min(560px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;border:1px solid var(--line);box-shadow:0 20px 60px #0003;padding:18px}.modal-card h3{margin:0 0 12px}.template-pick{display:grid;gap:9px}.template-pick button{width:100%;text-align:left;border:1px solid var(--line);background:#f8fbfb;padding:12px;border-radius:10px;cursor:pointer}.template-pick button b{display:block;margin-bottom:4px}.modal-close{margin-top:12px}'
    );

    html=html.replace(
      '<section id="settingsPage" class="page"><div class="panel settings-box"><h2>Template WhatsApp</h2><textarea id="waTemplate" rows="7"></textarea><p class="hint">Gunakan: {nama}, {model}, {plat}, {sa}, {tanggal_booking}</p><button id="saveSettingsBtn" class="btn primary">Simpan Template</button></div></section>',
      '<section id="settingsPage" class="page"><div class="panel settings-box"><h2>Template WhatsApp</h2><p class="hint">Template dapat diedit. Gunakan: {nama}, {model}, {plat}, {sa}, {tanggal_booking}</p><div id="waTemplateList" class="template-list"></div><button id="saveSettingsBtn" class="btn primary">Simpan Semua Template</button></div></section>'
    );

    html=html.replace(
      '<div id="toast" class="toast"></div>',
      '<div id="waTemplateModal" class="modal-backdrop"><div class="modal-card"><h3>Pilih Template WhatsApp</h3><div id="waTemplateChoices" class="template-pick"></div><button id="waTemplateClose" class="btn modal-close">Tutup</button></div></div><div id="toast" class="toast"></div>'
    );

    html=html.replace(
      'const DEFAULT_WA="Selamat pagi Bapak/Ibu {nama}, kami dari Agung Toyota Gianyar ingin mengingatkan jadwal perawatan kendaraan {model} ({plat}). Apakah kami dapat membantu membuatkan booking servis?";',
      'const DEFAULT_WA_TEMPLATES=[{id:"reminder",name:"Reminder Service",text:"Selamat pagi Bapak/Ibu {nama}, kami dari Agung Toyota Gianyar ingin mengingatkan jadwal perawatan kendaraan {model} ({plat}). Apakah kami dapat membantu membuatkan booking servis?"},{id:"followup",name:"Follow Up Belum Jawab",text:"Selamat pagi Bapak/Ibu {nama}, izin follow up kembali terkait pengingat servis kendaraan {model} ({plat}). Jika berkenan, kami siap membantu membuatkan jadwal servis."},{id:"booking",name:"Konfirmasi Booking",text:"Selamat pagi Bapak/Ibu {nama}, kami konfirmasi booking servis kendaraan {model} ({plat}) pada tanggal {tanggal_booking}. Terima kasih."},{id:"recall",name:"Hubungi Kembali",text:"Selamat pagi Bapak/Ibu {nama}, sesuai informasi sebelumnya kami menghubungi kembali terkait servis kendaraan {model} ({plat}). Apakah saat ini kami dapat membantu proses booking?"},{id:"promo",name:"Informasi Service",text:"Selamat pagi Bapak/Ibu {nama}, kami dari Agung Toyota Gianyar ingin menyampaikan informasi layanan untuk kendaraan {model} ({plat}). Silakan hubungi kami jika membutuhkan bantuan servis atau booking."}];'
    );

    html=html.replace(
      'function waLink(r){let t=localStorage.getItem("pfu_wa_template")||DEFAULT_WA;t=t.replaceAll("{nama}",r.customer||"").replaceAll("{model}",r.model||"").replaceAll("{plat}",r.police_no||"").replaceAll("{sa}",r.service_advisor||"").replaceAll("{tanggal_booking}",r.booking_date||"");return`https://wa.me/${r.telephone}?text=${encodeURIComponent(t)}`}',
      'function getWaTemplates(){try{const s=JSON.parse(localStorage.getItem("pfu_wa_templates")||"null");if(Array.isArray(s)&&s.length)return s}catch(e){}return DEFAULT_WA_TEMPLATES.map(x=>({...x}))}function saveWaTemplates(l){localStorage.setItem("pfu_wa_templates",JSON.stringify(l))}function fillWaTemplate(t,r){return String(t||"").replaceAll("{nama}",r.customer||"").replaceAll("{model}",r.model||"").replaceAll("{plat}",r.police_no||"").replaceAll("{sa}",r.service_advisor||"").replaceAll("{tanggal_booking}",r.booking_date||"")}function waUrlFromTemplate(r,t){return`https://wa.me/${r.telephone}?text=${encodeURIComponent(fillWaTemplate(t.text,r))}`}function renderWaTemplateSettings(){const l=getWaTemplates(),h=$("waTemplateList");if(!h)return;h.innerHTML=l.map((t,i)=>`<div class="template-card"><h3>${esc(t.name)}</h3><input class="wa-template-name" data-index="${i}" value="${esc(t.name)}"><textarea class="wa-template-text" data-index="${i}">${esc(t.text)}</textarea></div>`).join("")}function saveWaTemplateSettings(){const l=getWaTemplates();document.querySelectorAll(".wa-template-name").forEach(e=>{const i=Number(e.dataset.index);if(l[i])l[i].name=e.value.trim()||l[i].name});document.querySelectorAll(".wa-template-text").forEach(e=>{const i=Number(e.dataset.index);if(l[i])l[i].text=e.value});saveWaTemplates(l);toast("Semua template WhatsApp disimpan")}function openWaTemplateModal(id){const r=rows.find(x=>String(x.id)===String(id));if(!r||!r.telephone)return toast("Nomor WhatsApp tidak tersedia");const l=getWaTemplates();$("waTemplateChoices").innerHTML=l.map((t,i)=>`<button data-template-index="${i}"><b>${esc(t.name)}</b><span>${esc(fillWaTemplate(t.text,r)).slice(0,140)}</span></button>`).join("");$("waTemplateChoices").querySelectorAll("button").forEach(b=>b.onclick=()=>{window.open(waUrlFromTemplate(r,l[Number(b.dataset.templateIndex)]),"_blank");$("waTemplateModal").classList.remove("show")});$("waTemplateModal").classList.add("show")}'
    );

    html=html.replace(
      '${r.telephone?`<a class="wa-btn" target="_blank" href="${waLink(r)}">WhatsApp</a>`:"-"}',
      '${r.telephone?`<button class="wa-btn row-wa" data-id="${r.id}" style="border:0;cursor:pointer">WhatsApp</button>`:"-"}'
    );

    html=html.replace(
      'function bindTableEvents(){document.querySelectorAll(".row-status").forEach(e=>e.onchange=()=>updateRow(e.dataset.id,{follow_up_status:e.value}));document.querySelectorAll(".row-booking").forEach(e=>e.onchange=()=>updateBooking(e.dataset.id,e.value));document.querySelectorAll(".row-notes").forEach(e=>e.onchange=()=>updateRow(e.dataset.id,{notes:e.value}))}',
      'function bindTableEvents(){document.querySelectorAll(".row-status").forEach(e=>e.onchange=()=>updateRow(e.dataset.id,{follow_up_status:e.value}));document.querySelectorAll(".row-booking").forEach(e=>e.onchange=()=>updateBooking(e.dataset.id,e.value));document.querySelectorAll(".row-notes").forEach(e=>e.onchange=()=>updateRow(e.dataset.id,{notes:e.value}));document.querySelectorAll(".row-wa").forEach(e=>e.onclick=()=>openWaTemplateModal(e.dataset.id))}'
    );

    html=html.replace(
      'const waButton=r.telephone\n          ? `<a class="popup-wa" target="_blank" href="${waLink(r)}">WhatsApp</a>`\n          : "";',
      'const waButton=r.telephone\n          ? `<button class="popup-wa map-wa" data-id="${r.id}" style="border:0;cursor:pointer">WhatsApp</button>`\n          : "";'
    );

    html=html.replace(
      'setTimeout(()=>map.invalidateSize(),100)\n    }',
      'setTimeout(()=>map.invalidateSize(),100);setTimeout(()=>document.querySelectorAll(".map-wa").forEach(e=>e.onclick=()=>openWaTemplateModal(e.dataset.id)),120)\n    }'
    );

    html=html.replace(
      '$("saveSettingsBtn").onclick=()=>{localStorage.setItem("pfu_wa_template",$("waTemplate").value||DEFAULT_WA);toast("Template disimpan")};',
      '$("saveSettingsBtn").onclick=saveWaTemplateSettings;'
    );

    html=html.replace(
      '$("waTemplate").value=localStorage.getItem("pfu_wa_template")||DEFAULT_WA;',
      'renderWaTemplateSettings();$("waTemplateClose").onclick=()=>$("waTemplateModal").classList.remove("show");$("waTemplateModal").onclick=e=>{if(e.target===$("waTemplateModal"))$("waTemplateModal").classList.remove("show")};'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById("loading").innerHTML=
      "<b>Gagal memuat aplikasi.</b><br><small>"+String(err.message||err)+"</small>";
    console.error(err);
  }
})();
</script>
</body>
</html>
